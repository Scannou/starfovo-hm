<!doctype html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
  <link rel="stylesheet" href="{{ get_url(path='giallo-light.css') }}">
  <link rel="stylesheet" href="{{ get_url(path='giallo-dark.css') }}" media="(prefers-color-scheme: dark)">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='atom.xml', trailing_slash=false) }}">
</head>
<body class="flow">
  <header class="site-header">
    <a class="site-title" href="{{ config.base_url }}/">{{ config.title }}</a>
    <nav>
      <a href="{{ get_url(path='@/posts/_index.md') }}">posts</a>
      <a href="{{ get_url(path='tags') }}/">tags</a>
      <a href="{{ get_url(path='@/about.md') }}">about</a>
      <a href="{{ get_url(path='atom.xml', trailing_slash=false) }}">rss</a>
    </nav>
  </header>

  <main class="flow">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ now() | date(format="%Y") }} {{ config.extra.author }}</p>
  </footer>
</body>
</html>
