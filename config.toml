# Live URL. The deploy workflow overrides it with whatever GitHub Pages reports.
base_url = "https://scannou.github.io/starfovo-hm"
title = "starfovo"
description = "Notes on tech."
default_language = "en"
theme = "zola-quiet"

compile_sass = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
  { name = "tags", feed = true },
]

[markdown]
smart_punctuation = true


[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
author = "Marek F. (Starf, Scannt)"
github = "Scannou"
soundcloud = "Starf"
lastfm = "Starfa"
